  <style>
    html, body { margin: 0; padding: 0; background: #eceef1; }
    body { font-family: var(--goa-font-family-sans); }
    a { color: #006dcc; }
    a:hover { color: #045092; }
    .frame { background: #fff; border-radius: 12px; box-shadow: 0 16px 44px -18px rgba(0,0,0,0.35); border: 1px solid #d4d8dd; overflow: hidden; }
    .frame-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #1e252e; color: #fff; }
    .frame-badge { font-family: var(--goa-font-family-number); font-size: 13px; font-weight: 700; background: #0081a2; color: #fff; border-radius: 6px; padding: 2px 9px; }
    .frame-name { font-size: 15px; font-weight: 700; }
    .frame-aud { font-size: 12px; color: #aab3bd; }
    .phase { display: flex; align-items: center; gap: 12px; }
    .phase-num { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: #1e252e; color: #7cc7ff; font-size: 20px; flex-shrink: 0; }
    .phase-title { font-size: 22px; font-weight: 700; color: #1e252e; }
    .phase-sub { font-size: 14px; color: #5a636d; max-width: 1000px; }
    .note { box-sizing: border-box; background: #fff7e6; border: 1px solid #f0d9a0; border-left: 6px solid #e0a400; border-radius: 12px; padding: 18px 22px; }
    .note-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8a5a00; margin-bottom: 8px; }
    .note h4 { font-size: 19px; font-weight: 700; margin: 0 0 8px; color: #1e252e; }
    .note ul { margin: 0; padding-left: 20px; }
    .note li { font-size: 15px; line-height: 1.55; color: #3a444f; margin-bottom: 6px; }
    .note li:last-child { margin-bottom: 0; }
    .note b { color: #1e252e; }
    .xref { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13.5px; font-weight: 700; color: #5b4a9e; background: #efe8fb; border: 1px solid #d8cdf2; border-radius: 999px; padding: 4px 12px; }
    .built { display: inline-flex; align-items: flex-start; gap: 7px; margin-top: 10px; font-size: 13px; font-weight: 600; color: #005a3c; background: #e4f1ea; border: 1px solid #bfe0cc; border-radius: 10px; padding: 8px 12px; line-height: 1.45; }
    .built ion-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; color: #006f4c; }
    .opt { display: flex; flex-direction: column; gap: 10px; width: max-content; }
    .opt-head { display: flex; align-items: center; gap: 10px; }
    .opt-badge { font-family: var(--goa-font-family-number); font-size: 13px; font-weight: 700; background: #5b4a9e; color: #fff; border-radius: 7px; padding: 2px 10px; }
    .opt-name { font-size: 16px; font-weight: 700; color: #1e252e; }
    .opt-hyp { font-size: 13px; color: #5a636d; }
    .note-sm { box-sizing: border-box; background: #fff7e6; border: 1px solid #f0d9a0; border-left: 5px solid #e0a400; border-radius: 10px; padding: 12px 16px; }
    .note-sm ul { margin: 0; padding-left: 18px; }
    .note-sm li { font-size: 13.5px; line-height: 1.5; color: #3a444f; margin-bottom: 4px; }
    .note-sm li:last-child { margin-bottom: 0; }
    .note-sm b { color: #1e252e; }
    .wired { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #005a3c; background: #e4f1ea; border: 1px solid #bfe0cc; border-radius: 999px; padding: 3px 11px; }
    .frame .goab-wsm__heading { white-space: normal; overflow: visible; text-overflow: clip; }
    .frame .goab-wsm__header { height: auto; min-height: 32px; }
    /* The DS clips the queue table itself (overflow-x:hidden), so an ancestor scroller never
       engages and the Actions column is unreachable. Put the scroller on the table. */
    .frame .goab-table { overflow-x: auto; }
    /* 12 columns of default DS cell padding overflowed the 1179px shell card by 149px, pushing the
       row's View/Open actions off screen. Tighten the gutters so Actions sits in view at rest. */
    .frame .goab-table th, .frame .goab-table td { padding-left: 6px; padding-right: 6px; }
    .frame .goab-table th:first-child, .frame .goab-table td:first-child { padding-left: 10px; }
    .frame .goab-table th:last-child, .frame .goab-table td:last-child { padding-right: 10px; }
    /* .goab-modal caps height with 100vh, which resolves against the real browser viewport rather
       than the 1080px frame — the child-list modal collapsed to ~380px. Bound it to the frame. */
    .frame .goab-modal { max-height: 900px; }
    /* The modal renders inside the workspace card, so its z-index is scoped to that card's
       stacking context and the side menu / page header painted over the scrim — the background
       stayed reachable. Lift the card while a modal is open and raise the scrim above the chrome. */
    .frame .goab-wl__main:has(.goab-modal__root),
    .frame .goab-wl__card:has(.goab-modal__root) { position: relative; z-index: 400; }
    .frame .goab-wl:has(.goab-modal__root) .goab-wl__sidemenu,
    .frame .goab-wl:has(.goab-modal__root) .goab-wl__header,
    .frame .goab-wl:has(.goab-modal__root) .goab-wl__footer { z-index: 1; }
    .frame .goab-modal__root, .frame .goab-drawer { z-index: 99999; }
    /* Tab panels sat on a much bigger gap than the rest of the page — normalise. */
    .frame .goab-tabs__panel { padding-top: 8px; }
    /* GoabCallout writes its 24px bottom margin INLINE, so a stylesheet rule can't win — the
       callouts in the stack pass mb="none" instead and the 8px group gap governs. */
    .frame .goab-tabs__list { margin-bottom: 0; }
    /* Active header CTA: tertiary button sitting on a solid status fill, so its label and icon
       have to invert to white. */
    .frame [data-cta-on] .goab-button,
    .frame [data-cta-on] button { color: var(--goa-color-greyscale-white); }
    .frame [data-cta-on] ion-icon,
    .frame [data-cta-on] .goab-icon { color: var(--goa-color-greyscale-white); fill: var(--goa-color-greyscale-white); }

    /* Tertiary toolbar buttons sit on the tinted findability band — give them a white fill so they
       read as controls rather than as text on tint. */
    .frame .goab-btn--tertiary { background: var(--goa-color-greyscale-white); }
    /* An ACTIVE header CTA forces its label white to sit on the wrapper's status fill — the white
       tertiary fill above would put white on white. Let the wrapper's colour through. */
    .frame [data-cta-on] .goab-btn--tertiary,
    .frame [data-cta-on] .goab-btn { background: transparent; }
    /* A 1080px frame holding ~1223px of content has to scroll somewhere. With chaining on, one
       wheel gesture drove the card, hit its edge and jumped the document — that hand-off is the
       jitter. Contain it: the wheel over the card scrolls only the card, and the page scrolls from
       the margin around the frame. */
    .frame .goab-wl__card { overflow-y: auto; overscroll-behavior-y: contain; scroll-behavior: auto; }
    .frame .goab-wl__sidemenu { align-self: stretch; }

  </style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;showKpis&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Claims overview&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;hq-qa&quot;,&quot;options&quot;:[&quot;hq-qa&quot;,&quot;subsidy-eo&quot;,&quot;fdh-eo&quot;,&quot;funding-eo&quot;,&quot;finance-officer&quot;,&quot;lead&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Role &amp; access&quot;,&quot;description&quot;:&quot;Signed-in role for frame 14 — scopes tabs and queue (QA → Subsidy/FDH/Funding EO → Finance Officer → 1GX), bulk clear and release rights&quot;},&quot;grouping&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;flat&quot;,&quot;options&quot;:[&quot;bands&quot;,&quot;flat&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Information architecture&quot;,&quot;description&quot;:&quot;Frame 14: exception-first band grouping vs flat evidence-sorted queue&quot;},&quot;evidenceLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;focus&quot;,&quot;options&quot;:[&quot;calm&quot;,&quot;focus&quot;,&quot;quiet&quot;,&quot;ledger&quot;,&quot;banner&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Information architecture&quot;,&quot;description&quot;:&quot;Expanded-row density. calm = one verdict line + full-width violations + action row · focus = violations lead, score is a footnote with drivers behind a disclosure · quiet = two columns, no tints/bars/eyebrows · ledger/banner = original denser treatments&quot;},&quot;statusStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;exception&quot;,&quot;options&quot;:[&quot;exception&quot;,&quot;stages&quot;,&quot;meter&quot;,&quot;bar&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Information architecture&quot;,&quot;description&quot;:&quot;Claim review status cell: exception = a red chip only when a stage is blocking · stages = every applicable stage named in full · meter = 2/3 complete plus a worst-state dot · bar = segmented bar plus a plain-language line&quot;},&quot;showReviewFeatures&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review workflow&quot;,&quot;description&quot;:&quot;Show the reviewer workflow shipped in spec 004 — reviewer-raised flags (raise/carry, tally rows with provenance) and cross-team review requests (callout, queue badges + filter, comment-thread answers). Off hides every S1/S2 surface at once.&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? "hq-qa";
    const IDENT = {
      "hq-qa": ["Avery Solano", "avery.solano@gov.ab.ca", "HQ QA reviewer · June 2026 · first-line review · 107 received"],
      "subsidy-eo": ["Owen Castle", "owen.castle@gov.ab.ca", "Subsidy EO · June 2026 · subsidy stream"],
      "fdh-eo": ["Bea Fenwick", "bea.fenwick@gov.ab.ca", "Family Day Home EO · June 2026 · FDH stream"],
      "funding-eo": ["Nina Harlow", "nina.harlow@gov.ab.ca", "Funding EO · June 2026 · ICC · Affordability · WTU"],
      "finance-officer": ["Theo Marsh", "theo.marsh@gov.ab.ca", "Finance Officer · June 2026 · final release to 1GX"],
      "lead": ["Lena Ashgrove", "lena.ashgrove@gov.ab.ca", "Program lead · June 2026 · all stages"],
    };
    const id = IDENT[role] || IDENT["hq-qa"];
    return {
      role,
      grouping: this.props.grouping ?? "bands",
      evidenceMode: this.props.evidenceMode ?? "expand",
      evidenceLayout: this.props.evidenceLayout ?? "ledger",
      statusStyle: this.props.statusStyle ?? "exception",
      showKpis: this.props.showKpis ?? true,
      showReviewFeatures: this.props.showReviewFeatures ?? true,
      roleName: id[0], roleEmail: id[1], roleSubtitle: "",
    };
  }
}
</script>
